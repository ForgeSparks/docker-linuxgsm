---
name: Sync LinuxGSM
on:
  schedule:
    # Run every day at 04:15 UTC
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream LinuxGSM release tag to sync from (leave empty for latest release)'
        required: false
        default: ''
      base:
        description: 'Base branch for the pull request'
        required: false
        default: 'develop'

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: GameServerManagers/LinuxGSM
  UPSTREAM_TAG: ${{ github.event.inputs.tag || '' }}
  PR_BASE_BRANCH: ${{ github.event.inputs.base || 'develop' }}
  SHA_FILE: .linuxgsm-upstream.sha
  TAG_FILE: .linuxgsm-upstream.tag

jobs:
  sync:
    name: Check upstream LinuxGSM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_BASE_BRANCH }}

      - name: Read currently vendored upstream commit
        id: current
        run: |
          if [ -f "${SHA_FILE}" ]; then
            current_sha="$(tr -d '[:space:]' < "${SHA_FILE}")"
          else
            current_sha=""
          fi
          if [ -f "${TAG_FILE}" ]; then
            current_tag="$(tr -d '[:space:]' < "${TAG_FILE}")"
          else
            current_tag=""
          fi
          echo "sha=${current_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${current_tag}" >> "$GITHUB_OUTPUT"
          echo "Current vendored SHA: ${current_sha:-<none>}"
          echo "Current vendored tag: ${current_tag:-<none>}"

      - name: Resolve latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${UPSTREAM_TAG}" ]; then
            latest_tag="${UPSTREAM_TAG}"
          else
            latest_tag="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')"
          fi
          if [ -z "${latest_tag}" ]; then
            echo "::error::Could not resolve upstream latest release tag"
            exit 1
          fi
          latest_sha="$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/tags/${latest_tag}" | awk '{print $1}')"
          if [ -z "${latest_sha}" ]; then
            # Fall back to annotated-tag dereferenced ref
            latest_sha="$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/tags/${latest_tag}^{}" | awk '{print $1}')"
          fi
          if [ -z "${latest_sha}" ]; then
            echo "::error::Could not resolve commit SHA for tag ${latest_tag}"
            exit 1
          fi
          echo "tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${latest_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${latest_sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "Latest upstream tag: ${latest_tag}"
          echo "Latest upstream SHA: ${latest_sha}"

      - name: Compare SHAs
        id: diff
        run: |
          if [ "${{ steps.current.outputs.sha }}" = "${{ steps.upstream.outputs.sha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream files
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          git clone \
            --depth 1 \
            --branch "${{ steps.upstream.outputs.tag }}" \
            --filter=blob:none \
            --sparse \
            "https://github.com/${UPSTREAM_REPO}.git" \
            "${workdir}"
          (
            cd "${workdir}"
            git sparse-checkout set --cone
            git sparse-checkout set lgsm/modules
          )

          # Replace vendored files
          rm -rf lgsm/modules
          mkdir -p lgsm/modules
          cp -a "${workdir}/lgsm/modules/." lgsm/modules/
          cp "${workdir}/linuxgsm.sh" ./linuxgsm.sh
          chmod +x linuxgsm.sh
          find lgsm/modules -type f \( -name '*.sh' -o -name '*.py' \) -exec chmod +x {} +

          echo "${{ steps.upstream.outputs.sha }}" > "${SHA_FILE}"
          echo "${{ steps.upstream.outputs.tag }}" > "${TAG_FILE}"
          rm -rf "${workdir}"

      - name: Build PR body
        if: steps.diff.outputs.changed == 'true'
        id: body
        run: |
          old_sha='${{ steps.current.outputs.sha }}'
          new_sha='${{ steps.upstream.outputs.sha }}'
          old_tag='${{ steps.current.outputs.tag }}'
          new_tag='${{ steps.upstream.outputs.tag }}'
          {
            echo 'body<<EOF'
            echo "Automated update of vendored [LinuxGSM](https://github.com/${UPSTREAM_REPO}) files from release [\`${new_tag}\`](https://github.com/${UPSTREAM_REPO}/releases/tag/${new_tag})."
            echo ''
            if [ -n "${old_tag}" ]; then
              echo "**Previous release:** [\`${old_tag}\`](https://github.com/${UPSTREAM_REPO}/releases/tag/${old_tag}) ([\`${old_sha:0:7}\`](https://github.com/${UPSTREAM_REPO}/commit/${old_sha}))"
            elif [ -n "${old_sha}" ]; then
              echo "**Previous commit:** [\`${old_sha:0:7}\`](https://github.com/${UPSTREAM_REPO}/commit/${old_sha})"
            else
              echo "**Previous release:** _none_"
            fi
            echo "**New release:** [\`${new_tag}\`](https://github.com/${UPSTREAM_REPO}/releases/tag/${new_tag}) ([\`${new_sha:0:7}\`](https://github.com/${UPSTREAM_REPO}/commit/${new_sha}))"
            if [ -n "${old_sha}" ]; then
              echo ""
              echo "**Diff:** https://github.com/${UPSTREAM_REPO}/compare/${old_sha}...${new_sha}"
            fi
            echo ''
            echo 'This PR was generated automatically by the `Sync LinuxGSM` workflow.'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-linuxgsm-${{ steps.upstream.outputs.tag }}
          base: ${{ env.PR_BASE_BRANCH }}
          commit-message: |
            chore: sync LinuxGSM vendored files to ${{ steps.upstream.outputs.tag }}
          title: "chore: sync LinuxGSM vendored files to ${{ steps.upstream.outputs.tag }}"
          body: ${{ steps.body.outputs.body }}
          labels: |
            type: dependencies
          delete-branch: true
          add-paths: |
            linuxgsm.sh
            lgsm/modules/**
            .linuxgsm-upstream.sha
            .linuxgsm-upstream.tag
